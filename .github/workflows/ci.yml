name: Build and engine tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  factory:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Cache pinned sources and original Debian packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            upstream/
            tools/debs/
          key: noble-amd64-${{ hashFiles('upstream.lock.json', 'build-deps.lock.json') }}
      - name: Build locally and run unit plus real engine tests
        run: ./scripts/ci.sh
      - name: Preserve diagnostic logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: factory-test-evidence
          path: |
            tools/ci-evidence/*.log
            runtime/tests/*.log
          if-no-files-found: ignore
